# Audio runtime CI (AUD-2). The mixer and the audio models are part of the default build and tests (Graphics workflow: audio_test, audio_model_test). This workflow adds what needs miniaudio:
# the device adapter, the decoders and the AudioRuntime on miniaudio's null backend (no sound card on a runner), on Linux under ASan+UBSan and ThreadSanitizer and on Windows with MSVC. The mixer and models carry their own
# strict warning options in CMakeLists.txt (-Wall -Wextra -Werror -Wconversion -Werror=double-promotion; /W4 /WX), so the flags need not be global. miniaudio is fetched at the pinned tag and verified against a pinned SHA-256 (tools/audio/fetch_miniaudio.py); its warnings are not ours.
# These are software and null-device results on shared runners: whether a real device sounds right and its latency are hardware checks (docs/audio.md).
name: Audio

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-gcc:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer
          - name: tsan
            flags: -fsanitize=thread -fno-omit-frame-pointer
    name: linux-gcc (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Fetch miniaudio (hash-verified)
        run: python3 -I tools/audio/fetch_miniaudio.py "$RUNNER_TEMP/miniaudio"
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTING=ON
          -DSAIGE_BUILD_GRAPHICS=OFF -DSAIGE_BUILD_PROJECTS=OFF
          -DSAIGE_AUDIO_MINIAUDIO=ON -DSAIGE_MINIAUDIO_ROOT="$RUNNER_TEMP/miniaudio"
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
      - name: Build
        run: cmake --build build --parallel --target audio_test audio_model_test audio_device_test
      - name: Tests
        run: ctest --test-dir build -R "audio" --output-on-failure

  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Fetch miniaudio (hash-verified)
        run: python -I tools/audio/fetch_miniaudio.py "$env:RUNNER_TEMP/miniaudio"
      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
          -DSAIGE_BUILD_GRAPHICS=OFF -DSAIGE_BUILD_PROJECTS=OFF
          -DSAIGE_AUDIO_MINIAUDIO=ON -DSAIGE_MINIAUDIO_ROOT="$env:RUNNER_TEMP/miniaudio"
          -DCMAKE_CXX_FLAGS="/EHsc"
      - name: Build
        run: cmake --build build --config Release --parallel --target audio_test audio_model_test audio_device_test
      - name: Tests
        run: ctest --test-dir build -C Release -R "audio" --output-on-failure
