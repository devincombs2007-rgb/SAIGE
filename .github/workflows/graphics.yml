# CI for SAIGE graphics modules (owner: Rendering). Scoped to graphics paths so it never interferes with
# Core's CI. To be folded into Core's engine-wide CI once it exists (issue #2, D-17).
name: Graphics

on:
  push:
    branches: [main]
    paths:
      - "engine/rhi/**"
      - "engine/render/**"
      - "engine/gfx_test_support/**"
      - "tools/shaderc/**"
      - "cmake/SaigeGraphics.cmake"
      - ".github/workflows/graphics.yml"
  pull_request:
    paths:
      - "engine/rhi/**"
      - "engine/render/**"
      - "engine/gfx_test_support/**"
      - "tools/shaderc/**"
      - "cmake/SaigeGraphics.cmake"
      - ".github/workflows/graphics.yml"

permissions:
  contents: read

concurrency:
  group: graphics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc-debug-asan, cxx: g++, build_type: Debug, sanitizers: "ON" }
          - { name: clang-release, cxx: clang++, build_type: Release, sanitizers: "OFF" }
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and test
        run: |
          set -euo pipefail
          for mod in engine/rhi engine/render tools/shaderc; do
            cmake -S $mod -B build/$(basename $mod) -G Ninja \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DSAIGE_GFX_WARNINGS_AS_ERRORS=ON \
              -DSAIGE_GFX_SANITIZERS=${{ matrix.sanitizers }}
            cmake --build build/$(basename $mod) --parallel
            ctest --test-dir build/$(basename $mod) --output-on-failure
          done

  windows:
    name: windows-msvc
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: pwsh
        run: |
          foreach ($mod in 'engine/rhi', 'engine/render', 'tools/shaderc') {
            $name = Split-Path $mod -Leaf
            cmake -S $mod -B build/$name -G "Visual Studio 17 2022" -A x64 -DSAIGE_GFX_WARNINGS_AS_ERRORS=ON
            if ($LASTEXITCODE -ne 0) { exit 1 }
            cmake --build build/$name --config Release --parallel
            if ($LASTEXITCODE -ne 0) { exit 1 }
            ctest --test-dir build/$name -C Release --output-on-failure
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
