# Graphics CI (owner: Rendering). Complements Core's build.yml, which already builds the graphics modules with the
# default options. This workflow adds the strict and GPU-related configurations:
#   - linux-vulkan-lavapipe: Vulkan backend on Mesa lavapipe (CPU Vulkan) with validation layers, under Xvfb so the
#     Xlib swapchain test runs; shaders recompiled with glslang and checked with spirv-val; warnings as errors.
#   - linux-gcc-asan: whole tree with AddressSanitizer + UndefinedBehaviorSanitizer (no Vulkan).
#   - windows-msvc-vulkan: MSVC /W4 /WX with the Vulkan backend compiled against fetched Khronos headers. GitHub's
#     Windows runners have no Vulkan driver, so GPU tests report "skipped" (exit 77) there.
name: Graphics

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphics-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  linux-vulkan-lavapipe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan (lavapipe), validation layers, glslang, Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build mesa-vulkan-drivers libvulkan-dev vulkan-validationlayers \
            vulkan-tools glslang-tools spirv-tools xvfb libx11-dev
          vulkaninfo --summary | grep -E "apiVersion|deviceName" || true
      # The production tools' Python tests need the pipeline's Python packages (tools/production/requirements.txt); without them the test reports "skipped".
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/production/requirements.txt
      - name: Install the production tools' Python packages
        run: python -m pip install -r tools/production/requirements.txt
      # The humanoid animation tests and the animation viewer smoke test use real, licensed assets that are not committed: the UAL libraries (CC0) and six CMU captures. They are downloaded here,
      # every file checked against the SHA-256 in tools/animation/assets.json (the archives against the hashes in the asset catalog), so the tests run instead of skipping. Cached by the manifest's hash;
      # the cached files are re-verified each time. `--no-cache` means never an unverified copy from a tools cache.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/anim_assets
          key: anim-assets-${{ hashFiles('tools/animation/assets.json') }}
      - name: Restore animation assets (downloaded and hash-verified)
        run: python tools/animation/fetch_humanoid_assets.py "$RUNNER_TEMP/anim_assets" --no-cache
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DSAIGE_ENABLE_VULKAN=ON -DSAIGE_VULKAN_FETCH_HEADERS=ON -DSAIGE_GFX_WARNINGS_AS_ERRORS=ON -DSAIGE_REQUIRE_SSR_VALIDATION=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test (Xvfb)
        env:
          SAIGE_ANIM_ASSETS: ${{ runner.temp }}/anim_assets
        run: |
          mkdir -p captures
          # The SSR validation tests must exist (20) and must run here: a lane that required them cannot lose them (the configure step also fails without them).
          test "$(ctest --test-dir build -N -R '^ssr_' | sed -n 's/^Total Tests: //p')" = "20"
          SAIGE_REQUIRE_VALIDATION=1 SAIGE_CAPTURE_DIR=$PWD/captures xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Upload rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saige-lavapipe-captures
          path: captures/
          if-no-files-found: ignore

  linux-gcc-asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/anim_assets
          key: anim-assets-${{ hashFiles('tools/animation/assets.json') }}
      - name: Restore animation assets (downloaded and hash-verified)
        run: python3 tools/animation/fetch_humanoid_assets.py "$RUNNER_TEMP/anim_assets" --no-cache
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DSAIGE_GFX_SANITIZERS=ON -DSAIGE_GFX_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test (the real-asset animation tests run under ASan and UBSan)
        env:
          SAIGE_ANIM_ASSETS: ${{ runner.temp }}/anim_assets
        run: ctest --test-dir build --output-on-failure

  windows-msvc-vulkan:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/anim_assets
          key: anim-assets-${{ hashFiles('tools/animation/assets.json') }}
      - name: Restore animation assets (downloaded and hash-verified)
        run: python tools/animation/fetch_humanoid_assets.py "$env:RUNNER_TEMP/anim_assets" --no-cache
      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
          -DSAIGE_ENABLE_VULKAN=ON -DSAIGE_VULKAN_FETCH_HEADERS=ON -DSAIGE_GFX_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test (the real-asset animation tests run with MSVC's floating point)
        env:
          SAIGE_ANIM_ASSETS: ${{ runner.temp }}/anim_assets
        run: ctest --test-dir build -C Release --output-on-failure
