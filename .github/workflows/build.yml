name: Windows Debug test diagnosis

on:
  push:
    branches: [core/diagnose-msvc-debug-02]

permissions:
  contents: read

jobs:
  debug:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset windows-debug
      - run: cmake --build --preset windows-debug --parallel
      - run: ctest --preset windows-debug --timeout 35 -V
